version: '3.8'

services:
  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: model_results_api
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: model_results_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend_api
